<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File ke Firebase Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // Firebase configuration
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlMppEaPPleQZWRVRchh2HI9ZDDrn4wlM",
            authDomain: "mfnf-fdf76.firebaseapp.com",
            databaseURL: "https://mfnf-fdf76-default-rtdb.firebaseio.com",
            projectId: "mfnf-fdf76",
            storageBucket: "mfnf-fdf76.appspot.com",
            messagingSenderId: "868803816117",
            appId: "1:868803816117:web:8dc690460eda221e19ecfc",
            measurementId: "G-HTMBMWL6QL"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        // Fungsi untuk mengupload file
        window.uploadFile = function () {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Pilih file terlebih dahulu.");
                return;
            }

            // Menentukan referensi untuk file di Firebase Storage
            const storageRef = ref(storage, 'uploads/' + file.name);

            // Mengupload file
            const uploadTask = uploadBytesResumable(storageRef, file);

            // Menambahkan listener untuk proses upload
            uploadTask.on('state_changed',
                function (snapshot) {
                    // Proses upload berjalan
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    document.getElementById("progress").style.width = progress + "%";
                    document.getElementById("progress").innerText = Math.round(progress) + "%";
                },
                function (error) {
                    // Menangani error
                    console.error("Error uploading file:", error);
                },
                function () {
                    // Setelah upload selesai, mendapatkan URL file
                    getDownloadURL(uploadTask.snapshot.ref).then(function (downloadURL) {
                        const fileLink = document.getElementById("fileLink");
                        fileLink.innerText = downloadURL;
                        fileLink.href = downloadURL;
                        document.getElementById("progressContainer").classList.add("hidden");
                    });
                }
            );
        };
    </script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg shadow-lg w-11/12 md:w-1/3">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">Upload File ke Firebase Storage</h2>

        <div class="mb-4">
            <label for="fileInput" class="block text-sm font-medium text-gray-700 mb-2">Pilih File (Gambar atau PDF):</label>
            <input type="file" id="fileInput" accept="image/*,.pdf" 
                   class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:ring focus:ring-blue-500">
        </div>

        <button onclick="uploadFile()" 
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg focus:outline-none focus:ring focus:ring-blue-300">
            Upload
        </button>

        <div id="progressContainer" class="mt-4 hidden">
            <div class="w-full bg-gray-200 rounded-full h-4">
                <div id="progress" class="bg-blue-500 h-4 rounded-full text-xs text-center text-white"></div>
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-lg font-semibold text-gray-700">Link File yang Di-upload:</h3>
            <a id="fileLink" target="_blank" class="text-blue-500 hover:underline"></a>
        </div>
    </div>
</body>

</html>
